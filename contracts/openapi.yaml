components:
  schemas:
    AsignacionRoles:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AsignacionRoles.json
          format: uri
          readOnly: true
          type: string
        roles:
          description: "Lista completa de roles: reemplaza la anterior"
          items:
            examples:
              - 11111111-1111-4111-8111-111111111111
            format: uuid
            type: string
          maxItems: 20
          type:
            - array
            - "null"
          uniqueItems: true
      required:
        - roles
      type: object
    CambiosRol:
      additionalProperties: false
      minProperties: 1
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CambiosRol.json
          format: uri
          readOnly: true
          type: string
        descripcion:
          maxLength: 200
          type: string
        permisos:
          items:
            description: Permiso con formato <recurso>:<accion>, por ejemplo reservas:operar
            examples:
              - usuarios:administrar
            maxLength: 80
            pattern: ^[a-z][a-z0-9_]*:[a-z][a-z0-9_]*$
            type: string
          maxItems: 50
          type: array
          uniqueItems: true
      type: object
    CambiosUsuario:
      additionalProperties: false
      minProperties: 1
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CambiosUsuario.json
          format: uri
          readOnly: true
          type: string
        correo:
          examples:
            - ana@ejemplo.cl
          format: email
          maxLength: 254
          type: string
        estado:
          enum:
            - activo
            - bloqueado
            - inactivo
          type: string
      type: object
    ClaimsToken:
      additionalProperties: false
      properties:
        aud:
          examples:
            - - pingeso
          items:
            type: string
          type:
            - array
            - "null"
        exp:
          description: Vencimiento, segundos Unix
          format: int64
          type: integer
        iat:
          description: Emisión, segundos Unix
          format: int64
          type: integer
        iss:
          examples:
            - pingeso-identidad
          type: string
        jti:
          format: uuid
          type: string
        nbf:
          description: Válido desde, segundos Unix
          format: int64
          type: integer
        permisos:
          examples:
            - - perfiles:operar
              - reservas:operar
          items:
            type: string
          type:
            - array
            - "null"
        roles:
          examples:
            - - operador
          items:
            type: string
          type:
            - array
            - "null"
        sub:
          format: uuid
          type: string
      required:
        - iss
        - sub
        - aud
        - exp
        - iat
        - nbf
        - jti
        - roles
        - permisos
      type: object
    DatosPerfil:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DatosPerfil.json
          format: uri
          readOnly: true
          type: string
        apellido:
          examples:
            - Pérez
          maxLength: 80
          minLength: 1
          type: string
        atributos:
          additionalProperties: {}
          description: "Campos libres que define cada cliente, por ejemplo {\"estatura_cm\": 172}"
          maxProperties: 50
          type: object
        foto_url:
          examples:
            - https://boveda.example.cl/archivos/foto.jpg
          format: uri
          maxLength: 500
          type: string
        nombre:
          examples:
            - Ana
          maxLength: 80
          minLength: 1
          type: string
        telefono:
          examples:
            - "+56912345678"
          pattern: ^\+?[0-9]{8,15}$
          patternDescription: entre 8 y 15 dígitos, con + opcional
          type: string
      required:
        - nombre
        - apellido
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    JWK:
      additionalProperties: false
      properties:
        alg:
          enum:
            - RS256
          type: string
        e:
          description: Exponente RSA en base64url
          examples:
            - AQAB
          type: string
        kid:
          description: "Identificador de la llave: coincide con el header kid de cada token"
          type: string
        kty:
          enum:
            - RSA
          type: string
        "n":
          description: Módulo RSA en base64url
          type: string
        use:
          enum:
            - sig
          type: string
      required:
        - kty
        - use
        - alg
        - kid
        - "n"
        - e
      type: object
    JWKS:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/JWKS.json
          format: uri
          readOnly: true
          type: string
        keys:
          items:
            $ref: "#/components/schemas/JWK"
          type:
            - array
            - "null"
      required:
        - keys
      type: object
    ListaPermisos:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListaPermisos.json
          format: uri
          readOnly: true
          type: string
        datos:
          items:
            $ref: "#/components/schemas/Permiso"
          type:
            - array
            - "null"
      required:
        - datos
      type: object
    ListaRoles:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListaRoles.json
          format: uri
          readOnly: true
          type: string
        datos:
          items:
            $ref: "#/components/schemas/Rol"
          type:
            - array
            - "null"
      required:
        - datos
      type: object
    ListaUsuarios:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListaUsuarios.json
          format: uri
          readOnly: true
          type: string
        datos:
          items:
            $ref: "#/components/schemas/Usuario"
          type:
            - array
            - "null"
        paginacion:
          $ref: "#/components/schemas/Paginacion"
      required:
        - datos
        - paginacion
      type: object
    Paginacion:
      additionalProperties: false
      properties:
        limite:
          examples:
            - 20
          format: int64
          type: integer
        pagina:
          examples:
            - 1
          format: int64
          type: integer
        total:
          description: Total de coincidencias
          examples:
            - 57
          format: int64
          type: integer
        total_paginas:
          examples:
            - 3
          format: int64
          type: integer
      required:
        - pagina
        - limite
        - total
        - total_paginas
      type: object
    Perfil:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Perfil.json
          format: uri
          readOnly: true
          type: string
        actualizado_en:
          format: date-time
          type: string
        apellido:
          examples:
            - Pérez
          type: string
        atributos:
          additionalProperties: {}
          description: Campos libres que define cada cliente
          type: object
        foto_url:
          examples:
            - https://boveda.example.cl/archivos/foto.jpg
          format: uri
          type: string
        nombre:
          examples:
            - Ana
          type: string
        telefono:
          examples:
            - "+56912345678"
          type: string
        usuario_id:
          examples:
            - aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
          format: uuid
          type: string
      required:
        - usuario_id
        - nombre
        - apellido
        - atributos
        - actualizado_en
      type: object
    Permiso:
      additionalProperties: false
      properties:
        codigo:
          examples:
            - usuarios:administrar
          type: string
        descripcion:
          examples:
            - Crear, editar, desactivar y listar usuarios
          type: string
      required:
        - codigo
        - descripcion
      type: object
    Renovacion:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Renovacion.json
          format: uri
          readOnly: true
          type: string
        expira_en:
          description: Momento en que vence el token nuevo
          format: date-time
          type: string
      required:
        - expira_en
      type: object
    Rol:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Rol.json
          format: uri
          readOnly: true
          type: string
        actualizado_en:
          format: date-time
          type: string
        creado_en:
          format: date-time
          type: string
        descripcion:
          examples:
            - Administra usuarios, roles y perfiles
          type: string
        id:
          examples:
            - 11111111-1111-4111-8111-111111111111
          format: uuid
          type: string
        nombre:
          examples:
            - administrador
          type: string
        permisos:
          examples:
            - - perfiles:operar
              - roles:administrar
              - usuarios:administrar
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - id
        - nombre
        - descripcion
        - permisos
        - creado_en
        - actualizado_en
      type: object
    RolResumen:
      additionalProperties: false
      properties:
        id:
          examples:
            - 11111111-1111-4111-8111-111111111111
          format: uuid
          type: string
        nombre:
          examples:
            - administrador
          type: string
      required:
        - id
        - nombre
      type: object
    RolesAsignados:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/RolesAsignados.json
          format: uri
          readOnly: true
          type: string
        roles:
          items:
            $ref: "#/components/schemas/RolResumen"
          type:
            - array
            - "null"
      required:
        - roles
      type: object
    SaludRespuestaBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SaludRespuestaBody.json
          format: uri
          readOnly: true
          type: string
        estado:
          description: Estado del servicio
          examples:
            - ok
          type: string
      required:
        - estado
      type: object
    SolicitudCambioContrasena:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SolicitudCambioContrasena.json
          format: uri
          readOnly: true
          type: string
        contrasena_actual:
          examples:
            - admin-dev-local
          maxLength: 72
          minLength: 1
          type: string
        contrasena_nueva:
          examples:
            - una-clave-nueva-segura
          maxLength: 72
          minLength: 8
          type: string
      required:
        - contrasena_actual
        - contrasena_nueva
      type: object
    SolicitudCrearRol:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SolicitudCrearRol.json
          format: uri
          readOnly: true
          type: string
        descripcion:
          examples:
            - Atiende la recepción
          maxLength: 200
          type: string
        nombre:
          examples:
            - recepcionista
          pattern: ^[a-z][a-z0-9_]{2,39}$
          patternDescription: minúsculas, números y _; entre 3 y 40 caracteres
          type: string
        permisos:
          description: Permisos de este o de otros servicios
          items:
            description: Permiso con formato <recurso>:<accion>, por ejemplo reservas:operar
            examples:
              - usuarios:administrar
            maxLength: 80
            pattern: ^[a-z][a-z0-9_]*:[a-z][a-z0-9_]*$
            type: string
          maxItems: 50
          type:
            - array
            - "null"
          uniqueItems: true
      required:
        - nombre
        - permisos
      type: object
    SolicitudCrearUsuario:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SolicitudCrearUsuario.json
          format: uri
          readOnly: true
          type: string
        contrasena:
          examples:
            - una-clave-segura
          maxLength: 72
          minLength: 8
          type: string
        correo:
          examples:
            - ana@ejemplo.cl
          format: email
          maxLength: 254
          type: string
        roles:
          description: IDs de los roles iniciales
          items:
            examples:
              - 11111111-1111-4111-8111-111111111111
            format: uuid
            type: string
          maxItems: 20
          type:
            - array
            - "null"
          uniqueItems: true
      required:
        - correo
        - contrasena
      type: object
    SolicitudSesion:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SolicitudSesion.json
          format: uri
          readOnly: true
          type: string
        contrasena:
          examples:
            - admin-dev-local
          maxLength: 72
          minLength: 1
          type: string
        correo:
          examples:
            - admin@dev.local
          format: email
          maxLength: 254
          type: string
      required:
        - correo
        - contrasena
      type: object
    SolicitudTokenPrueba:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SolicitudTokenPrueba.json
          format: uri
          readOnly: true
          type: string
        permisos_extra:
          description: Permisos adicionales, por ejemplo de otro servicio
          items:
            description: Permiso con formato <recurso>:<accion>, por ejemplo reservas:operar
            examples:
              - usuarios:administrar
            maxLength: 80
            pattern: ^[a-z][a-z0-9_]*:[a-z][a-z0-9_]*$
            type: string
          maxItems: 50
          type:
            - array
            - "null"
          uniqueItems: true
        roles:
          description: Nombres de roles existentes; sus permisos entran al token
          examples:
            - - operador
          items:
            type: string
          maxItems: 10
          type:
            - array
            - "null"
          uniqueItems: true
        usuario_id:
          description: Valor de sub. Si falta, se inventa un UUID
          examples:
            - bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
          format: uuid
          type: string
      type: object
    TokenPrueba:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/TokenPrueba.json
          format: uri
          readOnly: true
          type: string
        claims:
          $ref: "#/components/schemas/ClaimsToken"
        expira_en:
          format: date-time
          type: string
        token:
          description: "JWT RS256 para usar en Authorization: Bearer"
          type: string
      required:
        - token
        - expira_en
        - claims
      type: object
    Usuario:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Usuario.json
          format: uri
          readOnly: true
          type: string
        actualizado_en:
          format: date-time
          type: string
        correo:
          examples:
            - admin@dev.local
          format: email
          type: string
        creado_en:
          format: date-time
          type: string
        estado:
          description: Solo una cuenta activa puede iniciar sesión
          enum:
            - activo
            - bloqueado
            - inactivo
          type: string
        id:
          examples:
            - aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
          format: uuid
          type: string
        roles:
          items:
            $ref: "#/components/schemas/RolResumen"
          type:
            - array
            - "null"
        ultimo_acceso:
          description: Último inicio de sesión; falta si nunca ha ingresado
          format: date-time
          type: string
      required:
        - id
        - correo
        - estado
        - roles
        - creado_en
        - actualizado_en
      type: object
    UsuarioActual:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UsuarioActual.json
          format: uri
          readOnly: true
          type: string
        actualizado_en:
          format: date-time
          type: string
        correo:
          examples:
            - admin@dev.local
          format: email
          type: string
        creado_en:
          format: date-time
          type: string
        estado:
          description: Solo una cuenta activa puede iniciar sesión
          enum:
            - activo
            - bloqueado
            - inactivo
          type: string
        expira_en:
          description: Momento en que vence el token de la sesión
          format: date-time
          type: string
        id:
          examples:
            - aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
          format: uuid
          type: string
        permisos:
          examples:
            - - perfiles:operar
              - roles:administrar
              - usuarios:administrar
          items:
            type: string
          type:
            - array
            - "null"
        roles:
          items:
            $ref: "#/components/schemas/RolResumen"
          type:
            - array
            - "null"
        ultimo_acceso:
          description: Último inicio de sesión; falta si nunca ha ingresado
          format: date-time
          type: string
      required:
        - permisos
        - expira_en
        - id
        - correo
        - estado
        - roles
        - creado_en
        - actualizado_en
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      description: "JWT en `Authorization: Bearer <token>`, para llamadas entre servicios."
      scheme: bearer
      type: http
    cookieSesion:
      description: JWT en la cookie de sesión (HttpOnly, Secure, SameSite=Lax), que fija POST /api/sesiones.
      in: cookie
      name: sesion
      type: apiKey
info:
  description: |-
    Servicio de identidad de la LPS (PT 6, grupo 6): sesiones, usuarios, roles, perfiles y emisión de JWT RS256.

    Cada operación declara en `x-permiso` lo que exige: `publico`, `autenticado` o un permiso `<recurso>:<accion>`. Sin token válido se responde 401; con token pero sin permiso, 403.

    El token viaja en la cookie `sesion` (navegador) o en `Authorization: Bearer` (entre servicios). Los demás servicios lo validan con las llaves de `/.well-known/jwks.json`.
  title: API Usuarios y Roles
  version: 0.2.0
openapi: 3.1.0
paths:
  /.well-known/jwks.json:
    get:
      description: Es la URL que los demás servicios configuran en `AUTH_JWKS_URL`.
      operationId: obtenerJWKS
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWKS"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Publica las llaves públicas para validar los JWT
      tags:
        - Sesiones
      x-permiso: publico
  /api/dev/tokens:
    post:
      description: "Solo existe con `API_ENV=dev`; con `test` o `prod` la ruta no existe (404). Emite un token firmado con la llave real del servicio, con los permisos de los roles pedidos más `permisos_extra`. El token viene en el body para usarlo como `Authorization: Bearer`."
      operationId: emitirTokenPrueba
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudTokenPrueba"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPrueba"
          description: OK
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Emite un JWT de prueba (solo con API_ENV=dev)
      tags:
        - Desarrollo
      x-permiso: publico
  /api/permisos:
    get:
      operationId: listarPermisos
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaPermisos"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - cookieSesion: []
        - bearer: []
      summary: Lista los permisos propios del servicio de identidad
      tags:
        - Roles
      x-permiso: autenticado
  /api/roles:
    get:
      operationId: listarRoles
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaRoles"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - cookieSesion: []
        - bearer: []
      summary: Lista todos los roles
      tags:
        - Roles
      x-permiso: roles:administrar
    post:
