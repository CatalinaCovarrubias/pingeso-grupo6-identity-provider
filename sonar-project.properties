# SonarQube Cloud identification
sonar.organization=catalinacovarrubias
sonar.projectKey=CatalinaCovarrubias_pingeso-grupo6-identity-provider

# Source code: everything except tests
sonar.sources=.
sonar.exclusions=**/*_test.go,**/vendor/**

# Test files
sonar.tests=.
