# Identificación del proyecto en SonarQube Cloud
sonar.organization=catalinacovarrubias
sonar.projectKey=CatalinaCovarrubias_pingeso-grupo6-identity-provider

# Código propio: la API en Go y el frontend (microcomponentes y app de desarrollo).
# src/components/ui lo genera shadcn y no se edita; esquema.d.ts y ejemplos.gen.ts los
# genera `pnpm codegen` desde el contrato.
sonar.sources=apps/api,apps/web/src
sonar.exclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,apps/api/internal/repository/**,apps/web/src/components/ui/**,apps/web/src/api/esquema.d.ts,apps/web/src/mocks/ejemplos.gen.ts

# Pruebas
sonar.tests=apps/api,apps/web/src
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx

# Cobertura: Go desde sus pruebas, el frontend desde vitest (lcov)
sonar.go.coverage.reportPaths=coverage.out
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info
